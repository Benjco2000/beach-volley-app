[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "volleyai"
version = "0.1.0"
description = "Analyse vidéo de gestes de beach-volley (manchette d'abord) : pose, features biomécaniques, modèle, feedback."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "opencv-python-headless>=4.9",
    "imageio-ffmpeg>=0.5",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "ultralytics>=8.3",
]

[project.optional-dependencies]
drive = ["google-api-python-client>=2.100", "google-auth>=2.23"]
app = ["streamlit>=1.38", "matplotlib>=3.8"]
llm = ["anthropic>=0.40"]
mlflow = ["mlflow>=2.14"]
dev = ["pytest>=8.0"]

[project.scripts]
volleyai = "volleyai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
